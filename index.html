<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DevTrack — Application Pipeline</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Inter:wght@100..900&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!--
      This fallback is replaced the moment main.tsx runs. If it is still on
      screen, the JavaScript never executed — so a blank-looking page always has
      something to say for itself.
    -->
    <div id="root">
      <div
        style="
          font-family: system-ui, sans-serif;
          max-width: 34rem;
          margin: 12vh auto;
          padding: 1.5rem;
          border: 1px solid #d0d7de;
          border-radius: 0.5rem;
          color: #1f2328;
        "
      >
        <h1 style="margin: 0 0 0.5rem; font-size: 1.25rem">DevTrack could not start</h1>
        <p style="margin: 0 0 0.75rem; color: #656d76; line-height: 1.5">
          The page loaded but its JavaScript did not run. Open DevTools (F12) and check the
          Console tab for the error.
        </p>
        <p style="margin: 0; color: #656d76; line-height: 1.5">
          If you were mid-edit, a hard refresh (<kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>R</kbd>)
          clears a stale hot-reload state.
        </p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
